# CasaOS: Uygulama Mağazası → sağ üstteki "+" → "Özel Uygulama Kur" → "İçe Aktar".
#
# Tek port (21114) üzerinden yayınlanır; Cloudflare Tunnel'ı bu porta yönlendir:
#   https://alanadin.com  →  http://<casaos-ip>:21114
# Web paneli, API ve uygulamaların WebSocket bağlantıları (/ws/id, /ws/relay)
# bu tek porttan geçer. HTTPS'i Cloudflare sağlar.
#
# Alan adını sonra da girebilirsin: CasaOS'ta uygulamanın ayarlarından
# RELAY ve PUBLIC_HOST değerlerini değiştirmen yeterli.
name: uzaktan-kontrol

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: uzaktan-kontrol-hbbs
    command: hbbs
    environment:
      RELAY: uzak.alanadin.com:21117
    ports:
      # Only needed for direct (port-forwarded) or LAN access; the tunnel uses 21114.
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
    volumes:
      - /DATA/AppData/uzaktan-kontrol/relay:/root
    depends_on: [hbbr]
    restart: unless-stopped
    x-casaos:
      envs:
        - container: RELAY
          description:
            en_us: "Your domain followed by :21117"
            tr_tr: "Alan adın ve sonuna :21117"

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: uzaktan-kontrol-hbbr
    command: hbbr
    ports:
      - "21117:21117"
    volumes:
      - /DATA/AppData/uzaktan-kontrol/relay:/root
    restart: unless-stopped

  account:
    image: ghcr.io/bariscagriyuce/uzaktan-kontrol-account:latest
    container_name: uzaktan-kontrol-account
    environment:
      PUBLIC_HOST: uzak.alanadin.com
      ADMIN_USERNAME: baris
      ADMIN_PASSWORD: buraya-guclu-bir-sifre-yaz
      RELAY_KEY_FILE: /relay-data/id_ed25519.pub
    volumes:
      - /DATA/AppData/uzaktan-kontrol/account:/data
      - /DATA/AppData/uzaktan-kontrol/relay:/relay-data:ro
    restart: unless-stopped
    x-casaos:
      envs:
        - container: PUBLIC_HOST
          description:
            en_us: Your domain
            tr_tr: Alan adın
        - container: ADMIN_USERNAME
          description:
            en_us: First account (created on first start)
            tr_tr: İlk hesap (ilk açılışta oluşturulur)
        - container: ADMIN_PASSWORD
          description:
            en_us: First account password
            tr_tr: İlk hesabın şifresi

  # One HTTP port for everything; Cloudflare terminates HTTPS in front of it.
  gateway:
    image: caddy:2
    container_name: uzaktan-kontrol-gateway
    command:
      - sh
      - -c
      - |
        cat > /etc/caddy/Caddyfile <<'EOF'
        {
            auto_https off
            admin off
        }
        :80 {
            handle /ws/id* {
                reverse_proxy hbbs:21118
            }
            handle /ws/relay* {
                reverse_proxy hbbr:21119
            }
            handle {
                reverse_proxy account:8000
            }
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "21114:80"
    depends_on: [hbbs, hbbr, account]
    restart: unless-stopped

x-casaos:
  architectures: [amd64, arm64]
  main: gateway
  author: bariscagriyuce
  developer: bariscagriyuce
  category: Utilities
  icon: https://raw.githubusercontent.com/bariscagriyuce/uzaktan-kontrol/master/res/128x128.png
  title:
    en_us: Uzaktan Kontrol
  tagline:
    en_us: Remote desktop server with accounts
    tr_tr: Hesaplı uzak masaüstü sunucusu
  description:
    en_us: ID server, relay, account server and web panel for the Uzaktan Kontrol apps.
    tr_tr: Uzaktan Kontrol uygulamaları için ID sunucusu, aktarıcı, hesap sunucusu ve web paneli.
  scheme: http
  port_map: "21114"
  index: /
