name: Flutter Nightly Build

on:
  # Started by hand (Actions -> Flutter Nightly Build -> Run workflow).
  workflow_dispatch:

# Builds are published to the "nightly" release.
permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
