name: ID sunucusu imajı

# Publishes ghcr.io/<owner>/uzaktan-kontrol-hbbs: rustdesk-server with device
# registration over WebSocket (server/rustdesk-server).
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "server/rustdesk-server/**"
      - ".github/workflows/server-hbbs-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build hbbs/hbbr
        working-directory: server/rustdesk-server
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config libssl-dev
          # On failure, surface the compiler output as annotations (readable without a login).
          if ! cargo build --release --locked --bin hbbs --bin hbbr > build.log 2>&1; then
            grep -E "^(error|warning: unused)|^  -->|^   = " build.log | head -40 | sed 's/^/::error::/'
            tail -25 build.log | sed 's/^/::error::/'
            exit 1
          fi
          mkdir -p bin
          cp target/release/hbbs target/release/hbbr bin/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/uzaktan-kontrol-hbbs" >> "$GITHUB_ENV"
      # amd64 only: compiling Rust under arm64 emulation takes too long here.
      - uses: docker/build-push-action@v6
        with:
          context: server/rustdesk-server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
