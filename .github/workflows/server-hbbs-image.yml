name: ID sunucusu imajı

# Publishes ghcr.io/<owner>/uzaktan-kontrol-hbbs: rustdesk-server with device
# registration over WebSocket (server/rustdesk-server).
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "server/rustdesk-server/**"
      - ".github/workflows/server-hbbs-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/uzaktan-kontrol-hbbs" >> "$GITHUB_ENV"
      # amd64 only: compiling Rust under arm64 emulation takes too long here.
      - uses: docker/build-push-action@v6
        with:
          context: server/rustdesk-server
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
